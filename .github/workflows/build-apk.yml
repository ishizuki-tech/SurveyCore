name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android CLI
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL             https://dl.google.com/android/cli/latest/linux_x86_64/install_root.sh             | sudo bash

          echo "::group::Android CLI"
          command -v android
          android --version
          echo "::endgroup::"

      - name: Inspect Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Android 17 platform"
          android --sdk="$ANDROID_SDK_ROOT"             sdk list 'platforms/android-37.0'             --all             --all-versions             --canary             || true
          echo "::endgroup::"

          echo "::group::Android 37 build tools"
          android --sdk="$ANDROID_SDK_ROOT"             sdk list 'build-tools/37.*'             --all             --all-versions             --canary             || true
          echo "::endgroup::"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          android --sdk="$ANDROID_SDK_ROOT"             sdk install             --canary             platform-tools             platforms/android-37.0             build-tools/37.0.0             ndk/29.0.14206865             cmake/3.22.1

          echo "::group::Installed SDK directories"
          ls -ld             "$ANDROID_SDK_ROOT/platform-tools"             "$ANDROID_SDK_ROOT/platforms/android-37.0"             "$ANDROID_SDK_ROOT/build-tools/37.0.0"             "$ANDROID_SDK_ROOT/ndk/29.0.14206865"             "$ANDROID_SDK_ROOT/cmake/3.22.1"
          echo "::endgroup::"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          chmod +x ./scripts/download_sherpa_onnx_android_aar.sh
          chmod +x ./scripts/download_sherpa_nemotron_1120ms.sh

      - name: Download sherpa-onnx Android AAR
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/download_sherpa_onnx_android_aar.sh

          AAR="$HOME/.cache/surveycore/libs/sherpa-onnx-1.13.4.aar"

          if [[ ! -s "$AAR" ]]; then
            echo "sherpa-onnx AAR was not created: $AAR" >&2
            exit 1
          fi

          ls -lh "$AAR"


      - name: Cache Nemotron 1120ms model
        uses: actions/cache@v4
        with:
          path: ~/.cache/surveycore/models
          key: nemotron-1120-int8-2026-04-25-v1

      - name: Bundle Nemotron 1120ms model into APK assets
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/download_sherpa_nemotron_1120ms.sh

          MODEL_NAME="sherpa-onnx-nemotron-speech-streaming-en-0.6b-1120ms-int8-2026-04-25"
          MODEL_DIR="$HOME/.cache/surveycore/models/$MODEL_NAME"
          ASSET_DIR="app/src/main/assets/models/$MODEL_NAME"

          mkdir -p "$ASSET_DIR"

          for name in \
            encoder.int8.onnx \
            decoder.int8.onnx \
            joiner.int8.onnx \
            tokens.txt
          do
            test -s "$MODEL_DIR/$name"
            cp -f "$MODEL_DIR/$name" "$ASSET_DIR/$name"
          done

          echo "::group::Bundled Nemotron assets"
          ls -lh "$ASSET_DIR"
          du -sh "$ASSET_DIR"
          echo "::endgroup::"

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Java"
          java -version
          echo "::endgroup::"

          echo "::group::Gradle"
          ./gradlew --version
          echo "::endgroup::"

          echo "::group::Git"
          git log -1 --oneline --decorate
          echo "::endgroup::"

          echo "::group::Android SDK"
          ls -lh "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          echo "::endgroup::"

      - name: Lint app
        run: ./gradlew :app:lint --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace


      - name: Verify Nemotron assets inside release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | head -1)"
          test -n "$APK"

          python3 - "$APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          model = "sherpa-onnx-nemotron-speech-streaming-en-0.6b-1120ms-int8-2026-04-25"
          required = [
              "encoder.int8.onnx",
              "decoder.int8.onnx",
              "joiner.int8.onnx",
              "tokens.txt",
          ]

          with zipfile.ZipFile(apk) as archive:
              for name in required:
                  path = f"assets/models/{model}/{name}"
                  info = archive.getinfo(path)
                  if info.file_size <= 0:
                      raise SystemExit(f"Empty APK asset: {path}")
                  if info.compress_type != zipfile.ZIP_STORED:
                      raise SystemExit(
                          f"Nemotron asset must be stored uncompressed: {path}"
                      )
                  print(
                      f"OK {path} "
                      f"{info.file_size / 1024 / 1024:.1f} MiB"
                  )
          PY

          ls -lh "$APK"

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/release               -maxdepth 1               -type f               -name '*.apk'               -print               | head -1
          )"

          if [[ -z "$APK" ]]; then
            echo "No release APK found." >&2
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          OUTPUT="SurveyCore-${SHORT_SHA}-release.apk"

          cp "$APK" "$OUTPUT"

          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "Built: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveyCore-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
