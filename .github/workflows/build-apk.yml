name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Locate Android CLI
        id: android_cli
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_CLI="$(command -v android || true)"

          if [[ -z "$ANDROID_CLI" ]]; then
            ANDROID_CLI="$(
              find "$ANDROID_SDK_ROOT/cmdline-tools"                 -type f                 -path '*/bin/android'                 -print                 | sort -V                 | tail -1
            )"
          fi

          if [[ -z "$ANDROID_CLI" || ! -x "$ANDROID_CLI" ]]; then
            echo "Android CLI was not found." >&2
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name android -print || true
            exit 1
          fi

          echo "Android CLI: $ANDROID_CLI"
          "$ANDROID_CLI" --version
          echo "path=$ANDROID_CLI" >> "$GITHUB_OUTPUT"

      - name: Inspect Android 17 SDK packages
        shell: bash
        env:
          ANDROID_CLI: ${{ steps.android_cli.outputs.path }}
        run: |
          set -euo pipefail

          echo "::group::Android 17 platform"
          "$ANDROID_CLI" sdk list 'platforms/android-37' --all --all-versions --canary || true
          echo "::endgroup::"

          echo "::group::Android 37 build tools"
          "$ANDROID_CLI" sdk list 'build-tools/37.*' --all --all-versions --canary || true
          echo "::endgroup::"

      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_CLI: ${{ steps.android_cli.outputs.path }}
        run: |
          set -euo pipefail

          "$ANDROID_CLI" sdk install --canary             platform-tools             platforms/android-37             build-tools/37.0.0             ndk/29.0.14206865             cmake/3.22.1

          echo "::group::Installed Android SDK packages"
          "$ANDROID_CLI" sdk list             'platform-tools|platforms/android-37|build-tools/37.*|ndk/29.0.14206865|cmake/3.22.1'             --all             --all-versions             --canary             || true
          echo "::endgroup::"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          chmod +x ./scripts/download_sherpa_onnx_android_aar.sh

      - name: Download sherpa-onnx Android AAR
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/download_sherpa_onnx_android_aar.sh

          AAR="$HOME/.cache/surveycore/libs/sherpa-onnx-1.13.4.aar"

          if [[ ! -s "$AAR" ]]; then
            echo "sherpa-onnx AAR was not created: $AAR" >&2
            exit 1
          fi

          ls -lh "$AAR"

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Java"
          java -version
          echo "::endgroup::"

          echo "::group::Gradle"
          ./gradlew --version
          echo "::endgroup::"

          echo "::group::Git"
          git log -1 --oneline --decorate
          echo "::endgroup::"

          echo "::group::Android SDK files"
          ls -ld             "$ANDROID_SDK_ROOT/platforms/android-37"             "$ANDROID_SDK_ROOT/build-tools/37.0.0"             "$ANDROID_SDK_ROOT/ndk/29.0.14206865"             "$ANDROID_SDK_ROOT/cmake/3.22.1"
          echo "::endgroup::"

      - name: Lint app
        run: ./gradlew :app:lint --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/release               -maxdepth 1               -type f               -name '*.apk'               -print               | head -1
          )"

          if [[ -z "$APK" ]]; then
            echo "No release APK found." >&2
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          OUTPUT="SurveyCore-${SHORT_SHA}-release.apk"

          cp "$APK" "$OUTPUT"

          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "Built: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveyCore-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
