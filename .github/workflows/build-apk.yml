name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        shell: bash
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/download_sherpa_onnx_android_aar.sh

      - name: Download sherpa-onnx Android AAR
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/download_sherpa_onnx_android_aar.sh
          ls -lh "$HOME/.cache/surveycore/libs/"

      - name: Lint app
        run: ./gradlew :app:lint --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"

          if [[ -z "$APK" ]]; then
            echo "No release APK found." >&2
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          OUTPUT="SurveyCore-${SHORT_SHA}-release.apk"

          cp "$APK" "$OUTPUT"

          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "Built: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveyCore-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
