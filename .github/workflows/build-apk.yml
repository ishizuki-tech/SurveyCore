name: Build Internal Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: internal-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  SURVEYCORE_ANDROID_CERT_SHA256: e0f3ce7dd68625e496628df2a3798d05e671968ca83a8801bcf7bd5f4c06e8ec

jobs:
  build-internal-release-apk:
    name: Build internal release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    outputs:
      release_tag: ${{ steps.apk.outputs.release_tag }}
      release_url: ${{ steps.apk.outputs.release_url }}
      download_url: ${{ steps.apk.outputs.download_url }}
      apk_name: ${{ steps.apk.outputs.name }}
      apk_sha256: ${{ steps.apk.outputs.sha256 }}
      short_sha: ${{ steps.apk.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android CLI
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://dl.google.com/android/cli/latest/linux_x86_64/install_root.sh \
            | sudo bash

          echo "::group::Android CLI"
          command -v android
          android --version
          echo "::endgroup::"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          android --sdk="$ANDROID_SDK_ROOT" \
            sdk install \
            --canary \
            platform-tools \
            platforms/android-37.0 \
            build-tools/37.0.0 \
            ndk/29.0.14206865 \
            cmake/3.22.1

          echo "::group::Installed SDK directories"
          ls -ld \
            "$ANDROID_SDK_ROOT/platform-tools" \
            "$ANDROID_SDK_ROOT/platforms/android-37.0" \
            "$ANDROID_SDK_ROOT/build-tools/37.0.0" \
            "$ANDROID_SDK_ROOT/ndk/29.0.14206865" \
            "$ANDROID_SDK_ROOT/cmake/3.22.1"
          echo "::endgroup::"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore internal Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYCORE_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SURVEYCORE_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYCORE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYCORE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          required_values=(
            KEYSTORE_BASE64
            STORE_PASSWORD
            KEY_ALIAS
            KEY_PASSWORD
          )

          for name in "${required_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required signing value is not configured: $name" >&2
              exit 1
            fi
          done

          SIGNING_DIR="${RUNNER_TEMP}/surveycore-signing"
          KEYSTORE="${SIGNING_DIR}/surveycore-internal.keystore"

          mkdir -p "$SIGNING_DIR"
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          if [[ ! -s "$KEYSTORE" ]]; then
            echo "Decoded Android keystore is missing or empty." >&2
            exit 1
          fi

          KEYTOOL_OUTPUT="$(
            keytool \
              -J-Duser.language=en \
              -list \
              -v \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS"
          )"

          CERT_SHA256="$(
            printf '%s\n' "$KEYTOOL_OUTPUT" \
              | awk '
                  /^[[:space:]]*SHA256:/ {
                    value = $2
                    gsub(":", "", value)
                    print tolower(value)
                    exit
                  }
                '
          )"

          if [[ -z "$CERT_SHA256" ]]; then
            echo "Could not read SHA-256 certificate fingerprint from keystore." >&2
            exit 1
          fi

          if [[ "$CERT_SHA256" != "$SURVEYCORE_ANDROID_CERT_SHA256" ]]; then
            echo "Android signing certificate mismatch." >&2
            echo "Expected: $SURVEYCORE_ANDROID_CERT_SHA256" >&2
            echo "Actual:   $CERT_SHA256" >&2
            exit 1
          fi

          echo "Internal Android signing key restored and verified."
          echo "Certificate SHA-256: $CERT_SHA256"

      - name: Verify internal build sources
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "./gradlew"
            "./scripts/download_sherpa_onnx_android_aar.sh"
            "./scripts/download_sherpa_nemotron_1120ms.sh"
            "./scripts/download_whisper_base_en.sh"
            "./scripts/prepare_internal_hf_token.sh"
            "./app/src/main/java/com/negi/surveycore/GemmaModelBootstrapActivity.kt"
            "./app/src/main/java/com/negi/surveycore/internal/InternalHfTokenProvider.kt"
            "./app/src/main/java/com/negi/surveycore/voice/SelectableVoiceAsr.kt"
          )

          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required internal-build file: $path" >&2
              exit 1
            fi
          done

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          chmod +x ./scripts/download_sherpa_onnx_android_aar.sh
          chmod +x ./scripts/download_sherpa_nemotron_1120ms.sh
          chmod +x ./scripts/download_whisper_base_en.sh
          chmod +x ./scripts/prepare_internal_hf_token.sh

      - name: Prepare encrypted Hugging Face token
        shell: bash
        env:
          SURVEYCORE_HF_TOKEN: ${{ secrets.SURVEYCORE_HF_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${SURVEYCORE_HF_TOKEN:-}" ]]; then
            echo "Repository Actions secret SURVEYCORE_HF_TOKEN is not configured." >&2
            exit 1
          fi

          if [[ "$SURVEYCORE_HF_TOKEN" != hf_* ]]; then
            echo "SURVEYCORE_HF_TOKEN does not look like a Hugging Face token." >&2
            exit 1
          fi

          ./scripts/prepare_internal_hf_token.sh

          TOKEN_ASSET="app/src/main/assets/internal/hf_token.properties"
          TOKEN_RESOURCE="app/src/main/res/values/internal_hf_token_generated.xml"

          test -s "$TOKEN_ASSET"
          test -s "$TOKEN_RESOURCE"

          if grep -Fq -- \
            "$SURVEYCORE_HF_TOKEN" \
            "$TOKEN_ASSET" \
            "$TOKEN_RESOURCE"
          then
            echo "Plaintext Hugging Face token was found in generated files." >&2
            exit 1
          fi

          echo "Encrypted internal Hugging Face credential prepared."

      - name: Cache sherpa-onnx Android AAR
        uses: actions/cache@v4
        with:
          path: ~/.cache/surveycore/libs/sherpa-onnx-1.13.4.aar
          key: sherpa-onnx-android-aar-1.13.4-v1

      - name: Download sherpa-onnx Android AAR
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/download_sherpa_onnx_android_aar.sh

          AAR="$HOME/.cache/surveycore/libs/sherpa-onnx-1.13.4.aar"

          if [[ ! -s "$AAR" ]]; then
            echo "sherpa-onnx AAR was not created: $AAR" >&2
            exit 1
          fi

          ls -lh "$AAR"

      - name: Cache Nemotron 1120ms model
        uses: actions/cache@v4
        with:
          path: ~/.cache/surveycore/models/sherpa-onnx-nemotron-speech-streaming-en-0.6b-1120ms-int8-2026-04-25
          key: nemotron-1120-int8-2026-04-25-v1

      - name: Bundle Nemotron 1120ms model into APK assets
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/download_sherpa_nemotron_1120ms.sh

          MODEL_NAME="sherpa-onnx-nemotron-speech-streaming-en-0.6b-1120ms-int8-2026-04-25"
          MODEL_DIR="$HOME/.cache/surveycore/models/$MODEL_NAME"
          ASSET_DIR="app/src/main/assets/models/$MODEL_NAME"

          mkdir -p "$ASSET_DIR"

          for name in \
            encoder.int8.onnx \
            decoder.int8.onnx \
            joiner.int8.onnx \
            tokens.txt
          do
            test -s "$MODEL_DIR/$name"
            cp -f "$MODEL_DIR/$name" "$ASSET_DIR/$name"
          done

          echo "::group::Bundled Nemotron assets"
          ls -lh "$ASSET_DIR"
          du -sh "$ASSET_DIR"
          echo "::endgroup::"

      - name: Cache Whisper base.en model
        uses: actions/cache@v4
        with:
          path: ~/.cache/surveycore/models/ggml-base.en.bin
          key: whisper-base-en-137c40403d78fd54d454da0f9bd998f78703390c

      - name: Bundle Whisper base.en model into APK assets
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/download_whisper_base_en.sh

          MODEL="$HOME/.cache/surveycore/models/ggml-base.en.bin"
          ASSET_DIR="app/src/main/assets/models/whisper"

          mkdir -p "$ASSET_DIR"
          test -s "$MODEL"
          cp -f "$MODEL" "$ASSET_DIR/ggml-base.en.bin"

          echo "::group::Bundled Whisper asset"
          ls -lh "$ASSET_DIR/ggml-base.en.bin"
          echo "::endgroup::"

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Java"
          java -version
          echo "::endgroup::"

          echo "::group::Gradle"
          ./gradlew --version
          echo "::endgroup::"

          echo "::group::Git"
          git log -1 --oneline --decorate
          echo "::endgroup::"

          echo "::group::Android SDK"
          ls -lh "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          echo "::endgroup::"

      - name: Lint app
        env:
          SURVEYCORE_SIGNING_STORE_FILE: ${{ runner.temp }}/surveycore-signing/surveycore-internal.keystore
          SURVEYCORE_SIGNING_STORE_PASSWORD: ${{ secrets.SURVEYCORE_ANDROID_STORE_PASSWORD }}
          SURVEYCORE_SIGNING_KEY_ALIAS: ${{ secrets.SURVEYCORE_ANDROID_KEY_ALIAS }}
          SURVEYCORE_SIGNING_KEY_PASSWORD: ${{ secrets.SURVEYCORE_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:lint --stacktrace

      - name: Build internal release APK
        env:
          SURVEYCORE_SIGNING_STORE_FILE: ${{ runner.temp }}/surveycore-signing/surveycore-internal.keystore
          SURVEYCORE_SIGNING_STORE_PASSWORD: ${{ secrets.SURVEYCORE_ANDROID_STORE_PASSWORD }}
          SURVEYCORE_SIGNING_KEY_ALIAS: ${{ secrets.SURVEYCORE_ANDROID_KEY_ALIAS }}
          SURVEYCORE_SIGNING_KEY_PASSWORD: ${{ secrets.SURVEYCORE_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"

          if [[ ! -s "$APK" ]]; then
            echo "Expected signed release APK is missing: $APK" >&2
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -print \
              || true
            exit 1
          fi

          SIGNATURE_OUTPUT="$(
            "$APKSIGNER" \
              verify \
              --verbose \
              --print-certs \
              "$APK"
          )"

          printf '%s\n' "$SIGNATURE_OUTPUT"

          SIGNER_COUNT="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | awk -F': ' '/^Number of signers:/ {print $2; exit}'
          )"

          CERT_SHA256="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | awk -F': ' '
                  /certificate SHA-256 digest:/ {
                    print tolower($NF)
                    exit
                  }
                '
          )"

          if [[ "$SIGNER_COUNT" != "1" ]]; then
            echo "Expected exactly one APK signer; found: ${SIGNER_COUNT:-unknown}" >&2
            exit 1
          fi

          if [[ "$CERT_SHA256" != "$SURVEYCORE_ANDROID_CERT_SHA256" ]]; then
            echo "APK signing certificate mismatch." >&2
            echo "Expected: $SURVEYCORE_ANDROID_CERT_SHA256" >&2
            echo "Actual:   ${CERT_SHA256:-missing}" >&2
            exit 1
          fi

          echo "APK signing certificate matches the fixed SurveyCore key."

      - name: Verify internal release APK contents
        shell: bash
        env:
          SURVEYCORE_HF_TOKEN: ${{ secrets.SURVEYCORE_HF_TOKEN }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          python3 - "$APK" <<'PY'
          import hashlib
          import os
          import sys
          import zipfile

          apk = sys.argv[1]
          expected_whisper_sha1 = (
              "137c40403d78fd54d454da0f9bd998f78703390c"
          )

          model = (
              "sherpa-onnx-nemotron-speech-streaming-en-0.6b-"
              "1120ms-int8-2026-04-25"
          )

          nemotron_files = [
              "encoder.int8.onnx",
              "decoder.int8.onnx",
              "joiner.int8.onnx",
              "tokens.txt",
          ]

          with zipfile.ZipFile(apk) as archive:
              for name in nemotron_files:
                  path = f"assets/models/{model}/{name}"
                  info = archive.getinfo(path)

                  if info.file_size <= 0:
                      raise SystemExit(f"Empty APK asset: {path}")

                  if info.compress_type != zipfile.ZIP_STORED:
                      raise SystemExit(
                          f"Nemotron asset must be stored uncompressed: {path}"
                      )

                  print(
                      f"OK {path} "
                      f"{info.file_size / 1024 / 1024:.1f} MiB"
                  )

              whisper_path = "assets/models/whisper/ggml-base.en.bin"
              whisper_info = archive.getinfo(whisper_path)

              if whisper_info.file_size <= 0:
                  raise SystemExit("Bundled Whisper model is empty.")

              if whisper_info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit(
                      "Whisper model must be stored uncompressed."
                  )

              whisper_sha1 = hashlib.sha1()
              with archive.open(whisper_path) as source:
                  while True:
                      chunk = source.read(4 * 1024 * 1024)
                      if not chunk:
                          break
                      whisper_sha1.update(chunk)

              actual_whisper_sha1 = whisper_sha1.hexdigest()

              if actual_whisper_sha1 != expected_whisper_sha1:
                  raise SystemExit(
                      "Bundled Whisper model SHA-1 mismatch: "
                      f"{actual_whisper_sha1}"
                  )

              print(
                  f"OK {whisper_path} "
                  f"{whisper_info.file_size / 1024 / 1024:.1f} MiB "
                  f"sha1={actual_whisper_sha1}"
              )

              token_path = "assets/internal/hf_token.properties"
              token_info = archive.getinfo(token_path)

              if token_info.file_size <= 0:
                  raise SystemExit(
                      "Encrypted Hugging Face token asset is empty."
                  )

              token_asset = archive.read(token_path)

              for marker in (b"version=1", b"key_a=", b"nonce=", b"ciphertext="):
                  if marker not in token_asset:
                      raise SystemExit(
                          f"Encrypted Hugging Face token marker is missing: {marker!r}"
                      )

              print(f"OK {token_path}")

          token = os.environ.get(
              "SURVEYCORE_HF_TOKEN",
              "",
          ).encode("utf-8")

          if not token:
              raise SystemExit(
                  "SURVEYCORE_HF_TOKEN is unavailable during APK verification."
              )

          overlap = max(len(token) - 1, 0)
          previous = b""

          with open(apk, "rb") as source:
              while True:
                  chunk = source.read(4 * 1024 * 1024)

                  if not chunk:
                      break

                  combined = previous + chunk

                  if token in combined:
                      raise SystemExit(
                          "Plaintext Hugging Face token was found inside the APK."
                      )

                  previous = (
                      combined[-overlap:]
                      if overlap
                      else b""
                  )

          print("OK plaintext Hugging Face token is not present in APK")
          PY

          ls -lh "$APK"

      - name: Collect internal APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            echo "Expected signed release APK is missing: $APK" >&2
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          OUTPUT="SurveyCore-${SHORT_SHA}-internal-release.apk"

          cp "$APK" "$OUTPUT"

          APK_SHA256="$(
            shasum -a 256 "$OUTPUT" | awk '{print $1}'
          )"

          RELEASE_TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${OUTPUT}"

          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

          echo "Built: $OUTPUT"
          echo "SHA-256: $APK_SHA256"
          echo "Release tag: $RELEASE_TAG"
          ls -lh "$OUTPUT"

      - name: Upload internal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveyCore-internal-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          RELEASE_TAG: ${{ steps.apk.outputs.release_tag }}
          RELEASE_URL: ${{ steps.apk.outputs.release_url }}
        run: |
          set -euo pipefail

          test -s "$APK"
          command -v gh >/dev/null

          NOTES="$RUNNER_TEMP/surveycore-release-notes.md"

          {
            echo "# SurveyCore ${RELEASE_TAG}"
            echo
            echo "Verified Android build from commit ${GITHUB_SHA}."
            echo
            echo "## APK"
            echo
            echo "- File: ${APK_NAME}"
            echo "- APK SHA-256: ${APK_SHA256}"
            echo "- Signing certificate SHA-256: ${SURVEYCORE_ANDROID_CERT_SHA256}"
            echo
            echo "## Included"
            echo
            echo "- Nemotron 1120ms streaming ASR"
            echo "- Whisper base.en"
            echo "- Gemma 3n E2B first-run provisioning"
            echo
            echo "## Install"
            echo
            echo "Download the APK on Android and open it."
            echo
            echo "For adb:"
            echo
            echo '```bash'
            echo "adb install -r "${APK_NAME}""
            echo '```'
            echo
            echo "Source commit: ${GITHUB_SHA}"
          } > "$NOTES"

          if gh release view "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             >/dev/null 2>&1
          then
            gh release upload "$RELEASE_TAG"               "$APK"               --clobber               --repo "$GITHUB_REPOSITORY"

            gh release edit "$RELEASE_TAG"               --title "SurveyCore build #${GITHUB_RUN_NUMBER}"               --notes-file "$NOTES"               --latest               --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG"               "$APK"               --target "$GITHUB_SHA"               --title "SurveyCore build #${GITHUB_RUN_NUMBER}"               --notes-file "$NOTES"               --latest               --repo "$GITHUB_REPOSITORY"
          fi

          echo "Public Release: $RELEASE_URL"

      - name: Clean up sensitive build material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/surveycore-signing"
          rm -f \
            app/src/main/assets/internal/hf_token.properties \
            app/src/main/res/values/internal_hf_token_generated.xml

  publish-download-page:
    name: Publish mobile download page
    runs-on: ubuntu-latest
    needs: build-internal-release-apk

    steps:
      - name: Generate mobile-first download page
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build-internal-release-apk.outputs.release_tag }}
          RELEASE_URL: ${{ needs.build-internal-release-apk.outputs.release_url }}
          DOWNLOAD_URL: ${{ needs.build-internal-release-apk.outputs.download_url }}
          APK_NAME: ${{ needs.build-internal-release-apk.outputs.apk_name }}
          APK_SHA256: ${{ needs.build-internal-release-apk.outputs.apk_sha256 }}
          SHORT_SHA: ${{ needs.build-internal-release-apk.outputs.short_sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          for name in \
            RELEASE_TAG \
            RELEASE_URL \
            DOWNLOAD_URL \
            APK_NAME \
            APK_SHA256 \
            SHORT_SHA
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing download-page value: $name" >&2
              exit 1
            fi
          done

          mkdir -p download-page

          GENERATED_UTC="$(date -u '+%Y-%m-%d %H:%M UTC')"
          OWNER="${REPOSITORY%%/*}"
          REPO_NAME="${REPOSITORY#*/}"
          PAGE_URL="https://${OWNER}.github.io/${REPO_NAME}/"
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          REPO_URL="${SERVER_URL}/${REPOSITORY}"
          QR_URL="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${PAGE_URL}"

          cat > download-page/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow">
            <title>SurveyCore Download</title>
            <style>
              :root {
                color-scheme: dark;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                  BlinkMacSystemFont, "Segoe UI", sans-serif;
              }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                min-height: 100vh;
                background:
                  radial-gradient(circle at top, #1c3557 0, #0b1220 40%, #070b12 100%);
                color: #eef4ff;
              }
              main {
                width: min(920px, calc(100% - 28px));
                margin: 0 auto;
                padding: max(24px, env(safe-area-inset-top)) 0
                  max(28px, env(safe-area-inset-bottom));
              }
              .card {
                border: 1px solid rgba(255,255,255,.12);
                border-radius: 24px;
                padding: clamp(22px,5vw,44px);
                background: rgba(13,22,36,.84);
                box-shadow: 0 24px 80px rgba(0,0,0,.36);
                backdrop-filter: blur(16px);
              }
              .eyebrow {
                margin: 0 0 8px;
                color: #91bfff;
                font-size: .8rem;
                font-weight: 800;
                letter-spacing: .12em;
                text-transform: uppercase;
              }
              h1 {
                margin: 0;
                font-size: clamp(2rem,7vw,3.6rem);
                line-height: 1.02;
              }
              .subtitle {
                margin: 18px 0 24px;
                color: #b9c7da;
                font-size: 1rem;
                line-height: 1.65;
              }
              .download {
                display: flex;
                width: 100%;
                min-height: 62px;
                align-items: center;
                justify-content: center;
                padding: 0 24px;
                border-radius: 15px;
                background: #eaf2ff;
                color: #07101d;
                font-size: 1.08rem;
                font-weight: 850;
                text-decoration: none;
              }
              .download:hover { opacity: .94; }
              .note {
                color: #91a2b7;
                font-size: .88rem;
                line-height: 1.55;
              }
              .qr-panel {
                display: grid;
                grid-template-columns: 320px 1fr;
                gap: 30px;
                align-items: center;
                margin-top: 30px;
                padding: 24px;
                border-radius: 18px;
                background: rgba(255,255,255,.055);
              }
              .qr-box {
                width: fit-content;
                padding: 10px;
                border-radius: 18px;
                background: #fff;
              }
              .qr-box img {
                display: block;
                width: 300px;
                height: 300px;
              }
              .grid {
                display: grid;
                grid-template-columns: repeat(2,minmax(0,1fr));
                gap: 14px;
                margin-top: 30px;
              }
              .item {
                padding: 16px 18px;
                border-radius: 14px;
                background: rgba(255,255,255,.055);
              }
              .label {
                display: block;
                margin-bottom: 7px;
                color: #8ea0b7;
                font-size: .74rem;
                font-weight: 800;
                letter-spacing: .08em;
                text-transform: uppercase;
              }
              code {
                overflow-wrap: anywhere;
                color: #f5f8ff;
              }
              .section {
                margin-top: 30px;
                padding-top: 26px;
                border-top: 1px solid rgba(255,255,255,.1);
              }
              .steps {
                margin: 0;
                padding-left: 22px;
                color: #c3cfdf;
                line-height: 1.8;
              }
              .links {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                margin-top: 28px;
              }
              .links a { color: #9ec8ff; }
              footer {
                margin-top: 26px;
                color: #73849a;
                font-size: .82rem;
              }
              @media (max-width: 700px) {
                main {
                  width: min(100% - 20px, 920px);
                  padding-top: 10px;
                }
                .card {
                  border-radius: 18px;
                  padding: 22px 18px 26px;
                }
                .qr-panel { display: none; }
                .grid { grid-template-columns: 1fr; }
                h1 { font-size: clamp(2rem,12vw,3rem); }
              }
            </style>
          </head>
          <body>
            <main>
              <section class="card">
                <p class="eyebrow">SurveyCore · Public Release</p>
                <h1>Latest Android APK</h1>

                <p class="subtitle">
                  Scan this page with the Android phone that will install SurveyCore,
                  then download the latest verified APK directly.
                </p>

                <a class="download" href="${DOWNLOAD_URL}">
                  Download APK
                </a>

                <p class="note">
                  Direct public GitHub Release download. No GitHub account and no ZIP
                  extraction are required.
                </p>

                <div class="qr-panel">
                  <div class="qr-box">
                    <img
                      src="${QR_URL}"
                      alt="QR code for SurveyCore download page"
                      width="300"
                      height="300"
                    >
                  </div>
                  <div>
                    <h2>Scan with Android</h2>
                    <p class="subtitle">
                      The QR opens the permanent SurveyCore download page.
                    </p>
                    <code>${PAGE_URL}</code>
                  </div>
                </div>

                <div class="section">
                  <h2>Install on Android</h2>
                  <ol class="steps">
                    <li>Tap <strong>Download APK</strong>.</li>
                    <li>Open <strong>${APK_NAME}</strong>.</li>
                    <li>If Android asks, allow installs from this browser.</li>
                    <li>Tap <strong>Install</strong>.</li>
                  </ol>
                </div>

                <div class="grid">
                  <div class="item">
                    <span class="label">Release</span>
                    <code>${RELEASE_TAG}</code>
                  </div>
                  <div class="item">
                    <span class="label">APK</span>
                    <code>${APK_NAME}</code>
                  </div>
                  <div class="item">
                    <span class="label">Commit</span>
                    <code>${SHORT_SHA}</code>
                  </div>
                  <div class="item">
                    <span class="label">Workflow</span>
                    <code>#${RUN_NUMBER}</code>
                  </div>
                  <div class="item">
                    <span class="label">APK SHA-256</span>
                    <code>${APK_SHA256}</code>
                  </div>
                  <div class="item">
                    <span class="label">Signing Certificate SHA-256</span>
                    <code>e0f3ce7dd68625e496628df2a3798d05e671968ca83a8801bcf7bd5f4c06e8ec</code>
                  </div>
                </div>

                <div class="links">
                  <a href="${RELEASE_URL}">GitHub Release</a>
                  <a href="${RUN_URL}">Actions run</a>
                  <a href="${REPO_URL}">Repository</a>
                </div>

                <footer>Updated ${GENERATED_UTC}.</footer>
              </section>
            </main>
          </body>
          </html>
          HTML

          touch download-page/.nojekyll

          cat > download-page/latest.json <<JSON
          {
            "repository": "${REPOSITORY}",
            "release_tag": "${RELEASE_TAG}",
            "release_url": "${RELEASE_URL}",
            "download_url": "${DOWNLOAD_URL}",
            "apk_name": "${APK_NAME}",
            "apk_sha256": "${APK_SHA256}",
            "short_sha": "${SHORT_SHA}",
            "run_id": "${RUN_ID}",
            "run_number": "${RUN_NUMBER}",
            "signing_certificate_sha256": "e0f3ce7dd68625e496628df2a3798d05e671968ca83a8801bcf7bd5f4c06e8ec",
            "generated_utc": "${GENERATED_UTC}"
          }
          JSON

      - name: Publish download page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./download-page
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Update SurveyCore download page for ${{ needs.build-internal-release-apk.outputs.release_tag }}"

